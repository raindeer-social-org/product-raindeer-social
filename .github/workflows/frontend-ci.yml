name: frontend-ci
# No `branches:` filter — see backend-ci.yml's comment: a required check
# scoped only to PRs targeting main leaves stacked feature-branch PRs
# permanently stuck waiting for a status that never reports.
on:
  pull_request:
    paths: ["apps/web/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web
